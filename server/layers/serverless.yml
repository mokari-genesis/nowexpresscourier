service: layers

frameworkVersion: '3'

provider:
  name: aws
  region: us-east-1
  runtime: nodejs22.x

package:
  patterns:
    - '!**'
    - 'nodejs/**'
    - '!nodejs/node_modules/**/*.test.js'
    - '!nodejs/node_modules/serverless/**'
    - '!nodejs/node_modules/serverless-offline/**'
    - '!nodejs/node_modules/.bin/serverless*'
    - '!nodejs/node_modules/.bin/sls'

layers:
  nodejs:
    name: nowExpress-${opt:stage, 'dev'}-layers
    description: 'nowExpress dependencies'
    # Zip root must contain nodejs/node_modules (Lambda Node.js convention).
    path: .
    compatibleRuntimes:
      - nodejs22.x
      - nodejs24.x

resources:
  Outputs:
    NodejsLayerExport:
      Value:
        Ref: NodejsLambdaLayer
      Export:
        Name: nowExpress-${opt:stage, 'dev'}-NodejsLambdaLayer
