service: nowExpress
plugins:
  - serverless-offline

custom:
  # ESM ignores NODE_PATH. Local bare imports resolve via server/node_modules
  # symlink → layers/node/node_modules (see npm run setup in server/).
  #
  # Map --stage → Secrets Manager path segment (prod | dev).
  # Anything not listed falls back to "dev".
  secretEnvByStage:
    prod: prod
    dev: dev
  secretEnv: ${self:custom.secretEnvByStage.${opt:stage}, 'dev'}

  # Secrets Manager secret name must be exactly: prod/nowExpress | dev/nowExpress
  apisecret: ${ssm:/aws/reference/secretsmanager/${self:custom.secretEnv}/nowExpress}

provider:
  name: aws
  runtime: nodejs22.x
  versionFunctions: true
  stage: ${opt:stage}
  region: us-east-1
  deploymentBucket:
    name: ${self:custom.apisecret.BUCKET}

  environment:
    #ACCOUNT_ID: ${self:custom.apisecret.ACCOUNT_ID}
    #AWS_POOL_ID: ${self:custom.apisecret.AWS_POOL_ID}
    STAGE: ${self:provider.stage}
    CURRENT_ENV: ${self:provider.stage}
    APP_ENV: ${self:custom.secretEnv}
    DATABASE_NAME: ${self:custom.apisecret.DB_NAME}

  iamRoleStatements:
    - Effect: Allow
      Action:
        - lambda:InvokeAsync
        - lambda:InvokeFunction
      Resource: '*'
    - Effect: Allow
      Action:
        - secretsmanager:GetSecretValue
      Resource:
        - arn:aws:secretsmanager:${aws:region}:${aws:accountId}:secret:nowExpress/*

package:
  include:
    - ../../libs/**
    - ../../vendor/**
    - ../../entityQueries/**
    - ../../utils/**
  exclude:
    - node_modules/**

functions:
  proxy:
    timeout: 30
    memorySize: 2048
    handler: handler.app
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors:
            origin: '*'
            allowCredentials: false
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - app_id
              - device_id
    #layers:
    #  - ${self:custom.apisecret.LAYERS}
