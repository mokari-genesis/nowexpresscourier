service: nowExpress
plugins:
  - serverless-offline

custom:
  secretEnvByStage:
    prod: prod
    dev: dev
  secretEnv: ${self:custom.secretEnvByStage.${opt:stage}, 'dev'}

  # Secrets Manager secret name must be exactly: prod/nowExpress | dev/nowExpress
  apisecret: ${ssm:/aws/reference/secretsmanager/${self:custom.secretEnv}/nowExpress}

provider:
  name: aws
  runtime: nodejs22.x
  versionFunctions: true
  stage: ${opt:stage}
  region: us-east-1
  deploymentBucket:
    name: ${self:custom.apisecret.BUCKET}

  environment:
    #ACCOUNT_ID: ${self:custom.apisecret.ACCOUNT_ID}
    #AWS_POOL_ID: ${self:custom.apisecret.AWS_POOL_ID}
    STAGE: ${self:provider.stage}
    CURRENT_ENV: ${self:provider.stage}
    APP_ENV: ${self:custom.secretEnv}
    DATABASE_NAME: ${self:custom.apisecret.DB_NAME}
    S3_BUCKET: ${self:custom.apisecret.BUCKET}
    EXPORT_URL_TTL_SECONDS: ${self:custom.apisecret.EXPORT_URL_TTL_SECONDS, '900'}

  iamRoleStatements:
    - Effect: Allow
      Action:
        - lambda:InvokeAsync
        - lambda:InvokeFunction
      Resource: '*'
    - Effect: Allow
      Action:
        - secretsmanager:GetSecretValue
      Resource:
        - arn:aws:secretsmanager:${aws:region}:${aws:accountId}:secret:nowExpress/*
    - Effect: Allow
      Action:
        - s3:PutObject
        - s3:GetObject
      Resource:
        - arn:aws:s3:::${self:custom.apisecret.BUCKET}/exports/*

package:
  include:
    - ../../libs/**
    - ../../vendor/**
    - ../../entityQueries/**
  exclude:
    - node_modules/**
    - '**/*.test.js'

functions:
  proxy:
    timeout: 60
    memorySize: 2048
    handler: handler.app
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors:
            origin: '*'
            allowCredentials: false
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - app_id
              - device_id
    layers:
      - ${cf:layers-${self:custom.secretEnv}.NodejsLayerExport}
